<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description, discovery links and JSON-LD come from
         src/site (agentReadySite in vite.config.ts), as does the prerendered
         homepage inside #root. -->
  </head>
  <body>
    <script>
      window.__scanPreload = fetch("/api/scan")
        .then(async (r) => ({ status: r.status, body: r.status === 200 ? await r.json() : null }))
        .catch(() => null);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
