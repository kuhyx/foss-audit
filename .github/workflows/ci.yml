# Mirrors the local pre-commit gate, so green-local means green-CI.
# The live scan is NOT run here: a runner is not kuhy's PC, so every test
# works against small hand-written fixtures instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: pip install -e ".[dev]"
      - name: Format
        run: ruff format --check foss_audit tests
      - name: Lint
        run: ruff check foss_audit tests
      - name: Types
        run: mypy
      - name: Tests + 100% branch coverage
        run: pytest --cov-fail-under=100

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned pnpm from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      # 24 is the engines floor; pinning CI to it catches newer-only APIs.
      # .nvmrc is the one pin (checked by the dependency-freshness gate).
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Lint (typecheck + eslint)
        run: pnpm run lint
      - name: Shellcheck
        run: shellcheck run.sh scripts/*.sh scripts/lib/*.sh
      - name: Tests + coverage gate
        run: pnpm run coverage
      - name: Build
        run: pnpm run build
